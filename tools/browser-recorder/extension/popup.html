<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VAP Browser Recorder</title><link rel="stylesheet" href="style.css"></head>
<body class="popup"><header><span class="mark">V</span><div><strong>VAP Browser Recorder</strong><small>AI needs a Flight Recorder</small></div><span class="badge">試作</span></header>
<main><p class="eyebrow">ON YOUR DEVICE</p><h1>その回答を、手元に残す。</h1><p class="muted">ページ上のテキストを選択して取り込み、内容を確認してから保存できます。</p>
<button id="capture" class="primary">選択したテキストを取り込む</button>
<section id="draft" hidden><div class="section-title"><h2>保存する内容</h2><span id="size" class="badge"></span></div><p id="origin" class="mono"></p><pre id="preview"></pre><p class="muted small">選択した本文とサイトのオリジンを、この端末に平文で保存します。URLのパス・クエリは保存しません。取り込み時点のスナップショットです。</p><label class="check"><input type="checkbox" id="consent"> この内容を保存する</label><button id="save" class="primary" disabled>署名して保存</button></section>
<p id="status" role="status" aria-live="polite"></p><button id="vault" class="secondary">記録庫・書き出し・検証を開く <span>↗</span></button>
<footer>外部送信なし · 手動で選んだ範囲のみ<br>提供者の認証・信頼できる時刻・VAP準拠は未確立</footer></main><script type="module" src="popup.mjs"></script></body></html>
