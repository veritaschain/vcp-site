name: CSS backdrop capture controls
on:
  pull_request:
    paths:
      - 'tools/site-css/backdrop-control.cjs'
      - 'tools/site-css/render-check.cjs'
      - '.github/workflows/css-backdrop-diagnostic.yml'
  push:
    branches: [main]
    paths:
      - 'tools/site-css/backdrop-control.cjs'
      - 'tools/site-css/render-check.cjs'
      - '.github/workflows/css-backdrop-diagnostic.yml'
permissions:
  contents: read
jobs:
  same-css-controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        mode: [baseline, candidate]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.22.1'
      - run: npm ci --prefix tools/site-css --ignore-scripts --no-audit --no-fund
      - run: node tools/site-css/node_modules/playwright/cli.js install-deps chromium
      - name: Verify and unpack pinned test browser
        run: |
          curl --fail --show-error --location --output "$RUNNER_TEMP/css-chrome.zip" 'https://storage.googleapis.com/chrome-for-testing-public/156.0.8078.80/linux64/chrome-linux64.zip'
          printf '%s  %s\n' 'b711c720f774be355197f32edf37e0651418ba036d92446ee2da19ac017540a7' "$RUNNER_TEMP/css-chrome.zip" | sha256sum --check --status
          unzip -q "$RUNNER_TEMP/css-chrome.zip" -d "$RUNNER_TEMP/css-chrome"
      - name: Record fixed same-CSS pairs
        env:
          CSS_BROWSER_PATH: ${{ runner.temp }}/css-chrome/chrome-linux64/chrome
          CSS_EVIDENCE_DIR: ${{ runner.temp }}/css-evidence
          CSS_BACKDROP_CONTROL_MODE: ${{ matrix.mode }}
        run: node tools/site-css/backdrop-control.cjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: css-backdrop-${{ matrix.mode }}
          path: ${{ runner.temp }}/css-evidence/backdrop-controls/
          retention-days: 30
