name: Verify published certificate contrast (temporary)
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 66f763083122218a7af17faa210e5a6352b24074
          path: subject
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.1'
      - name: Verify fixed source and diagnostic script syntax
        run: |
          test "$(git -C subject rev-parse HEAD)" = '66f763083122218a7af17faa210e5a6352b24074'
          node --check tools/check-live-certificate-contrast-temp.cjs
      - name: Install isolated pinned browser and contrast tools
        env:
          PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT: '60000'
        run: |
          npm install --prefix .verify-tools --ignore-scripts --no-audit --save-exact playwright@1.56.1 axe-core@4.13.0
          node .verify-tools/node_modules/playwright/cli.js install --with-deps --only-shell chromium
      - name: Read public files and exercise scoped synthetic certificate
        env:
          PW_MODULE: ${{ github.workspace }}/.verify-tools/node_modules/playwright
          AXE_SCRIPT: ${{ github.workspace }}/.verify-tools/node_modules/axe-core/axe.min.js
        run: timeout 240 node tools/check-live-certificate-contrast-temp.cjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: public-certificate-contrast-verification
          path: live-contrast-evidence/
          if-no-files-found: warn
          retention-days: 14
