name: Browser Recorder regression

on:
  pull_request:
    # Path filtering also covers stacked release PRs before their base merges.
    paths:
      - 'tools/browser-recorder/**'
      - '.github/workflows/browser-recorder.yml'
      - 'vso/announcements/2026-10-31-vap-browser-recorder-preview/**'
  push:
    branches: [main]
    paths:
      - 'tools/browser-recorder/**'
      - '.github/workflows/browser-recorder.yml'
      - 'vso/announcements/2026-10-31-vap-browser-recorder-preview/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-recorder-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-recorder:
    name: Browser Recorder / Chrome ${{ matrix.chrome.version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        chrome:
          - version: '156.0.8078.80'
            sha256: 'b711c720f774be355197f32edf37e0651418ba036d92446ee2da19ac017540a7'
            full_suite: true
          - version: '137.0.7151.119'
            sha256: '680a672ed0cc7b8fae6ee5b21691a55273228b05e1f3f80580606c4db203994a'
            full_suite: false
    defaults:
      run:
        shell: bash
        working-directory: tools/browser-recorder
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      RECORDER_BASELINE: a23bfdfbc02879f2ab6d5939bcb86085d4595ec5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.1'
          cache: npm
          cache-dependency-path: tools/browser-recorder/package-lock.json

      - name: Install locked browser-test dependencies
        run: |
          printf 'CHROME_EXECUTABLE=%s/vap-recorder-chrome/chrome-linux64/chrome\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'BROWSER_EVIDENCE_DIR=%s/browser-recorder-evidence\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/browser-recorder-evidence"
          npm ci --ignore-scripts --no-audit --no-fund
          npx --no-install playwright install-deps chromium
          sudo apt-get install --yes --no-install-recommends fonts-noto-cjk

      - name: Download and verify the pinned Chrome for Testing binary
        run: |
          curl --fail --location --retry 2 --max-time 180 \
            'https://storage.googleapis.com/chrome-for-testing-public/${{ matrix.chrome.version }}/linux64/chrome-linux64.zip' \
            --output "$RUNNER_TEMP/vap-recorder-chrome.zip"
          printf '%s  %s\n' \
            '${{ matrix.chrome.sha256 }}' \
            "$RUNNER_TEMP/vap-recorder-chrome.zip" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/vap-recorder-chrome"
          unzip -q "$RUNNER_TEMP/vap-recorder-chrome.zip" -d "$RUNNER_TEMP/vap-recorder-chrome"
          "$CHROME_EXECUTABLE" --version | tee "$BROWSER_EVIDENCE_DIR/chrome-version.txt"
          node --version | tee "$BROWSER_EVIDENCE_DIR/node-version.txt"
          git rev-parse HEAD | tee "$BROWSER_EVIDENCE_DIR/checkout-commit.txt"

      - name: Confirm large-page regression against the pinned previous implementation
        run: |
          cp extension/lib/capture.mjs "$RUNNER_TEMP/current-capture.mjs"
          trap 'cp "$RUNNER_TEMP/current-capture.mjs" extension/lib/capture.mjs' EXIT
          git show "$RECORDER_BASELINE:tools/browser-recorder/extension/lib/capture.mjs" > extension/lib/capture.mjs
          set +e
          node --test --test-reporter=tap --test-name-pattern='^short selection ignores' tests/browser/large-dom.test.mjs > "$BROWSER_EVIDENCE_DIR/large-dom-baseline.txt" 2>&1
          status=$?
          set -e
          cat "$BROWSER_EVIDENCE_DIR/large-dom-baseline.txt"
          test "$status" -eq 1
          node --input-type=module - "$BROWSER_EVIDENCE_DIR/large-dom-baseline.txt" <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const tap = readFileSync(process.argv[2], 'utf8').replace(/\r\n/g, '\n');
          const names = [
            'short selection ignores 50002 unrelated elements in neighboring subtrees',
            'short selection ignores 50002 unrelated flat sibling elements',
          ];
          const error = 'page.evaluate: Error: 確認するDOMが多すぎます。選択範囲を狭くしてください。';
          const results = [...tap.matchAll(/^([ \t]*)(not ok|ok) (\d+) - (.+)$/gm)];
          assert.deepEqual(results.map(row => [row[1], row[2], Number(row[3]), row[4]]),
            names.map((name, index) => ['', 'not ok', index + 1, name]),
            'Only the two exact baseline cases may run, and both must fail');
          for (const [index, result] of results.entries()) {
            const body = tap.slice(result.index + result[0].length, results[index + 1]?.index ?? tap.length);
            const diagnostic = body.match(/^\n  ---\n([\s\S]*?)\n  \.\.\.(?:\n|$)/);
            assert.ok(diagnostic, 'Missing diagnostic: ' + names[index]);
            assert.match(diagnostic[1], /^  failureType: 'testCodeFailure'$/m);
            assert.match(diagnostic[1], /^  code: 'ERR_TEST_FAILURE'$/m);
            const message = diagnostic[1].match(/^  error: \|-\n    ([^\n]*)\n/m);
            assert.ok(message, 'Missing error field: ' + names[index]);
            assert.equal(message[1], error, 'Unexpected failure reason: ' + names[index]);
          }
          assert.deepEqual([...tap.matchAll(/^\d+\.\.\d+[^\n]*$/gm)].map(row => row[0]), ['1..2']);
          for (const [label, count] of Object.entries({ tests: 2, suites: 0, pass: 0, fail: 2, cancelled: 0, skipped: 0, todo: 0 })) {
            const values = [...tap.matchAll(new RegExp('^# ' + label + ' (\\d+)$', 'gm'))];
            assert.equal(values.length, 1, 'Missing or duplicated TAP total: ' + label);
            assert.equal(Number(values[0][1]), count, 'Unexpected TAP total: ' + label);
          }
          assert.doesNotMatch(tap, /^\s*Bail out!/m);
          console.log(JSON.stringify({ baseline_cases: names, expected_error: error, verified: true }));
          NODE
          cp "$RUNNER_TEMP/current-capture.mjs" extension/lib/capture.mjs
          git diff --exit-code -- extension/lib/capture.mjs

      - name: Run unit and cryptographic regression tests
        if: matrix.chrome.full_suite
        run: npm test | tee "$BROWSER_EVIDENCE_DIR/unit-tests.txt"
      - name: Verify retained archives and current versioned distribution
        if: matrix.chrome.full_suite
        run: |
          mkdir -p "$RUNNER_TEMP/recorder-baseline"
          git -C ../.. archive "$RECORDER_BASELINE" tools/browser-recorder | tar -x -C "$RUNNER_TEMP/recorder-baseline"
          python3 "$RUNNER_TEMP/recorder-baseline/tools/browser-recorder/scripts/package.py" --output "$RUNNER_TEMP/recorder-historical.zip"
          cmp "$RUNNER_TEMP/recorder-historical.zip" ../../vso/announcements/2026-10-31-vap-browser-recorder-preview/downloads/VAP_Browser_Recorder_v0.1.1.zip
          (cd ../../vso/announcements/2026-10-31-vap-browser-recorder-preview/downloads && sha256sum --check VAP_Browser_Recorder_v0.1.1.zip.sha256)
          printf '%s  %s\n' 'd17496cf9b096da85546a1e343e791138a1c807f1a37c518b28c140e424ffcf4' '../../vso/announcements/2026-10-31-vap-browser-recorder-preview/downloads/VAP_Browser_Recorder_v0.1.0.zip' | sha256sum --check
          python3 scripts/package.py --output "$BROWSER_EVIDENCE_DIR/VAP_Browser_Recorder_v0.1.2.zip" | tee "$BROWSER_EVIDENCE_DIR/current-archive.json"
          python3 scripts/package.py --output "$RUNNER_TEMP/recorder-current-rebuild.zip"
          cmp "$RUNNER_TEMP/recorder-current-rebuild.zip" "$BROWSER_EVIDENCE_DIR/VAP_Browser_Recorder_v0.1.2.zip"
          cmp "$RUNNER_TEMP/recorder-current-rebuild.zip" ../../vso/announcements/2026-10-31-vap-browser-recorder-preview/downloads/VAP_Browser_Recorder_v0.1.2.zip
          python3 scripts/check-distribution.py | tee "$BROWSER_EVIDENCE_DIR/distribution-check.json"
          (cd "$BROWSER_EVIDENCE_DIR" && sha256sum VAP_Browser_Recorder_v0.1.2.zip > VAP_Browser_Recorder_v0.1.2.zip.sha256)
      - name: Run real DOM selection regression tests
        run: npm run test:browser-capture | tee "$BROWSER_EVIDENCE_DIR/capture-browser-tests.txt"
      - name: Run large-DOM selection regression tests
        run: node --test tests/browser/large-dom.test.mjs | tee "$BROWSER_EVIDENCE_DIR/large-dom-fixed.txt"
      - name: Run unpacked-extension lifecycle regression tests
        if: matrix.chrome.full_suite
        run: npm run test:browser-extension | tee "$BROWSER_EVIDENCE_DIR/extension-browser-tests.txt"
      - name: Run both historical unpacked-extension upgrade suites
        if: matrix.chrome.full_suite
        run: |
          for version in 0.1.0 0.1.1; do
            evidence="$BROWSER_EVIDENCE_DIR/upgrade-from-$version"
            mkdir -p "$evidence"
            BASELINE_VERSION="$version" BROWSER_EVIDENCE_DIR="$evidence" npm run test:browser-upgrade | tee "$evidence/tests.txt"
          done
      - name: Run minimum-version extension storage and export flow
        if: ${{ !matrix.chrome.full_suite }}
        run: npm run test:browser-storage | tee "$BROWSER_EVIDENCE_DIR/storage-browser-tests.txt"

      # Only synthetic evidence and a reviewed-source candidate ZIP are uploaded.
      # Browser profiles, signing keys and dependencies remain outside this folder.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: browser-recorder-${{ matrix.chrome.version }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/browser-recorder-evidence/
          if-no-files-found: warn
          retention-days: 30
