name: Inspect retained identical-CSS cross-trial evidence
on:
  push:
    branches: [diagnostics/pr189-render-20261104]
    paths: [.github/workflows/pr189-cross-trial-evidence.yml]
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.22.1
      - run: npm ci --prefix tools/site-css --ignore-scripts --no-audit --no-fund
      - name: Download and hash-check fixed-count control evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, tempfile, urllib.request, urllib.error, zipfile
          from pathlib import Path
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl): return None
          url='https://api.github.com/repos/veritaschain/vcp-site/actions/artifacts/13293589699/zip'
          expected='70997c16b3e09dc32fcbcc48805201e40ef7fd5ced9767150d10b94a919c64f7'
          req=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'})
          try: response=urllib.request.build_opener(NoRedirect).open(req,timeout=30)
          except urllib.error.HTTPError as error:
              if error.code not in (301,302,303,307,308): raise
              target=error.headers['Location']
              if not target.startswith('https://'): raise RuntimeError('insecure redirect')
              response=urllib.request.urlopen(target,timeout=60)
          destination=Path(os.environ['RUNNER_TEMP'])/'retained-controls'
          destination.mkdir(exist_ok=False)
          wanted={'diagnostic.json'}
          for label in ('reference-reference','compiled-compiled','reference-compiled'):
              for trial in (1,2,3):
                  wanted.add(f'{label}-{trial}-details.json')
                  for side in (0,1): wanted.add(f'{label}-{trial}-{side}.png')
          with tempfile.TemporaryDirectory() as temp:
              archive=Path(temp)/'controls.zip'; sha=hashlib.sha256(); size=0
              with response,archive.open('wb') as stream:
                  while block:=response.read(1024*1024):
                      size+=len(block)
                      if size>100_000_000: raise RuntimeError('archive exceeds limit')
                      sha.update(block); stream.write(block)
              if sha.hexdigest()!=expected: raise RuntimeError('archive digest mismatch')
              print('RETAINED_ARCHIVE_SHA256='+sha.hexdigest())
              with zipfile.ZipFile(archive) as z:
                  for name in wanted:
                      matches=[n for n in z.namelist() if n==name or n.endswith('/'+name)]
                      if len(matches)!=1: raise RuntimeError('ambiguous or missing retained file: '+name)
                      raw=z.read(matches[0])
                      (destination/name).write_bytes(raw)
              print('CONTROL_METADATA='+json.dumps(json.loads((destination/'diagnostic.json').read_text()),ensure_ascii=True))
          PY
      - name: Compare fixed cross-trial pairs with the unchanged pixel comparator
        run: |
          node <<'JS'
          'use strict';
          const fs=require('node:fs'),path=require('node:path'),crypto=require('node:crypto');
          const {comparePixels}=require(path.resolve('tools/site-css/render-check.cjs'));
          const {PNG}=require(path.resolve('tools/site-css/node_modules/pngjs'));
          const root=path.join(process.env.RUNNER_TEMP,'retained-controls');
          const pairs=[['compiled-compiled-1-0','compiled-compiled-2-0'],['compiled-compiled-1-0','compiled-compiled-3-0'],['reference-reference-1-0','reference-reference-2-0'],['reference-compiled-1-0','reference-compiled-1-1']];
          const result=[];
          for(const [left,right] of pairs) {
            const bytes=[left,right].map(n=>fs.readFileSync(path.join(root,n+'.png')));
            const comparison=comparePixels(...bytes);
            const names=[left,right].map(n=>n.replace(/-[01]$/,'')+'-details.json');
            const details=names.map(n=>JSON.parse(fs.readFileSync(path.join(root,n)))[0]);
            const images=bytes.map(b=>PNG.sync.read(b));
            const points=comparison.aboveTolerancePoints||[];
            const firstPoints=points.slice(0,128).map(p=>({...p,rgba:images.map(im=>Array.from(im.data.subarray((p.y*im.width+p.x)*4,(p.y*im.width+p.x)*4+4)))}));
            const row={left,right,sameCSS:!left.startsWith('reference-compiled'),targetDetailsEqual:JSON.stringify(details[0])===JSON.stringify(details[1]),sha256:bytes.map(b=>crypto.createHash('sha256').update(b).digest('hex')),comparison:{...comparison,aboveTolerancePoints:firstPoints},boundedPoints:points.length>128};
            result.push(row); console.log('CROSS_TRIAL_RESULT='+JSON.stringify(row));
          }
          fs.writeFileSync(path.join(root,'cross-trial-report.json'),JSON.stringify(result,null,2));
          JS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pr189-cross-trial-analysis-${{ github.run_id }}
          path: ${{ runner.temp }}/retained-controls/cross-trial-report.json
          retention-days: 14
          if-no-files-found: error
