name: Inspect retained PR189 render evidence
on:
  push:
    branches: [diagnostics/pr189-render-20261104]
    paths: [.github/workflows/pr189-render-diagnostic.yml]
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify retained artifact and report the failed case
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json, os, tempfile, urllib.request, urllib.error, zipfile
          from pathlib import Path
          url = 'https://api.github.com/repos/veritaschain/vcp-site/actions/artifacts/13285015380/zip'
          expected = 'fd465adcd668cf0069a89783251add174407dbf6df4e5c31b70c4efc78823f1e'
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None
          req = urllib.request.Request(url, headers={
              'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28'})
          try:
              response = urllib.request.build_opener(NoRedirect).open(req, timeout=30)
          except urllib.error.HTTPError as error:
              if error.code not in (301, 302, 303, 307, 308):
                  raise
              target = error.headers['Location']
              if not target.startswith('https://'):
                  raise RuntimeError('non-HTTPS artifact redirect')
              # The signed redirect is fetched WITHOUT forwarding the GitHub token.
              response = urllib.request.urlopen(target, timeout=60)
          with tempfile.TemporaryDirectory() as temp:
              archive = Path(temp) / 'evidence.zip'
              sha = hashlib.sha256()
              size = 0
              with response, archive.open('wb') as stream:
                  while block := response.read(1024 * 1024):
                      size += len(block)
                      if size > 500_000_000:
                          raise RuntimeError('artifact exceeds bounded download')
                      sha.update(block)
                      stream.write(block)
              if sha.hexdigest() != expected:
                  raise RuntimeError('retained artifact digest mismatch')
              print('RETAINED_ARTIFACT_SHA256=' + sha.hexdigest())
              def visit(value):
                  if isinstance(value, dict):
                      if value.get('file') == 'blog/posts/2026-01-17-vcp-v1-1-regulatory-compliance-solutions/index.html':
                          print('TARGET_REPORT=' + json.dumps(value, ensure_ascii=True))
                      for child in value.values():
                          visit(child)
                  elif isinstance(value, list):
                      for child in value:
                          visit(child)
              with zipfile.ZipFile(archive) as z:
                  names = z.namelist()
                  reports = [n for n in names if n.endswith('report.json')]
                  if not reports:
                      raise RuntimeError('retained report missing')
                  for name in reports:
                      report = json.loads(z.read(name))
                      print('REPORT_FILE=' + json.dumps(name))
                      print('REPORT_KEYS=' + json.dumps(list(report) if isinstance(report, dict) else ['array']))
                      visit(report)
                  diffs = [n for n in names if '2026-01-17-vcp-v1-1-regulatory-compliance-solutions' in n and n.endswith('-differences.json')]
                  for name in diffs:
                      detail = z.read(name).decode('utf-8')
                      print('DIFFERENCE_FILE=' + json.dumps(name))
                      if len(detail) > 60000:
                          raise RuntimeError('difference report requires bounded follow-up inspection')
                      print('DIFFERENCE_REPORT=' + json.dumps(json.loads(detail), ensure_ascii=True))
          PY
