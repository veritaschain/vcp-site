name: Browser observation independent Python verification

on:
  push:
    branches: [main]
    paths:
      - 'tools/browser-observation-python-verifier/**'
      - 'tools/browser-recorder/extension/lib/**'
      - '.github/workflows/browser-observation-python-verify.yml'
  pull_request:
    branches: [main]
    paths:
      - 'tools/browser-observation-python-verifier/**'
      - 'tools/browser-recorder/extension/lib/**'
      - '.github/workflows/browser-observation-python-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  independent-python:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.1'
      - name: Install independent Ed25519 library
        run: python -m pip install --no-input -r tools/browser-observation-python-verifier/requirements.txt
      - name: Validate fixed signed pack against fixed independent checkpoint
        working-directory: tools/browser-observation-python-verifier
        run: python verify_observation.py fixtures/synthetic-pack.json --checkpoint fixtures/synthetic-checkpoint.json
      - name: Run negative, trust-boundary and browser interoperability checks
        working-directory: tools/browser-observation-python-verifier
        run: python -m unittest discover -s tests -p 'test_*.py' -v
