name: Browser observation independent Python verification

on:
  push:
    branches: [main]
    paths:
      - 'tools/browser-observation-python-verifier/**'
      - 'tools/browser-recorder/extension/lib/**'
      - '.github/workflows/browser-observation-python-verify.yml'
  pull_request:
    branches: [main]
    paths:
      - 'tools/browser-observation-python-verifier/**'
      - 'tools/browser-recorder/extension/lib/**'
      - '.github/workflows/browser-observation-python-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  independent-python:
    name: Python verifier / Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        node: ['22.23.4', '24.22.1']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - name: Install independent Ed25519 library
        run: python -m pip install --no-input -r tools/browser-observation-python-verifier/requirements.txt
      - name: Validate fixed signed pack against fixed independent checkpoint
        working-directory: tools/browser-observation-python-verifier
        run: python verify_observation.py fixtures/synthetic-pack.json --checkpoint fixtures/synthetic-checkpoint.json
      - name: Run negative, trust-boundary and browser interoperability checks
        working-directory: tools/browser-observation-python-verifier
        run: |
          python -m unittest discover -s tests -p 'test_*.py' -v
          python -O -m unittest discover -s tests -p 'test_public_keys.py' -v
