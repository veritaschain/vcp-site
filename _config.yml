# GitHub Pages (Jekyll) build settings for veritaschain.org.
#
# maintenance/ holds deployment records and review packages for other hosts
# (for example vap.veritaschain.org). They stay in this repository as records
# but are not published on veritaschain.org.
# src/ is the source of a separate (Cloudflare/Vite) build and is not part of
# the static site; its raw .tsx files carried superseded wording.
# tools/browser-recorder/ contains extension pages and synthetic test fixtures,
# not website pages. Versioned downloads under vso/ remain published.
# CNAME is listed because a custom exclude list replaces the GitHub Pages
# default that keeps it unpublished.
# vso/README.md is an internal description of an earlier version of /vso/ and
# was being served as https://veritaschain.org/vso/README.md (13 Nov 2026).
exclude:
  - maintenance/
  - src/
  - tools/browser-recorder/
  - CNAME
  - vso/README.md
